# api.gighub.store — 최초 구성 기준 파일.
#
# certbot --nginx 를 실행하면 EC2 사본에 443 서버 블록과 ssl_certificate
# 지시자를 자동으로 써넣는다. 그 이후의 진실은 EC2 사본이며, 이 파일은
# 서버를 처음부터 다시 만들 때 시작점으로만 사용한다.
#
# 배치 위치: /etc/nginx/conf.d/api.gighub.store.conf

server {
    listen 80;
    server_name api.gighub.store;

    # 신분증·보건증 이미지 업로드를 고려한 여유값.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # RemoteIpValve(backend/src/main/webapp/META-INF/context.xml)가 이 헤더로
        # request.isSecure() 를 판정한다. 이 줄이 없으면 Session·CSRF 쿠키에
        # Secure 가 붙지 않는다.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
