# EC2 운영 구성. 저장소 루트 compose.yaml(로컬 개발용)과 의도적으로 분리한다.
# 하나로 합치면 로컬에서 실수로 RDS 를 대상으로 명령을 실행할 위험이 생긴다.
#
# 배치 위치: /opt/gighub/compose.prod.yaml
# 값 주입:   /opt/gighub/.env  (Compose 가 자동으로 읽는다)

services:
  app:
    # 기본값을 두지 않는다. `${API_TAG:-dev}` 였을 때 낡은 :dev 이미지가 조용히
    # 올라왔다(#450, 경위는 SETUP.md 7절). 값이 없으면 구버전이 뜨는 대신 즉시
    # 실패해야 한다.
    #
    # API_TAG 가 비었을 때 각 명령이 어떻게 되는지 실측했다. 이 파일을 쓰는 워크플로
    # (deploy-api, migrate-db, seed-db)의 명령을 전수로 넣었다.
    #
    #   up / pull            exit 1  unable to get image 'ghcr.io/...:'  <- 의도한 지점
    #   stop / start         exit 0  기존 컨테이너만 다루고 태그를 해석하지 않는다
    #   --profile tools run  exit 0  app 의 보간이 비어도 다른 서비스를 막지 않는다
    #   config               exit 0  경고만 낸다
    #
    # 즉 migrate-db 와 seed-db 는 이 변경으로 깨지지 않는다. `config` 가 통과하므로
    # 값이 들어갔는지 확인할 때는 `config --images` 를 쓴다(SETUP.md 7절).
    image: ghcr.io/kb-24-2-gighub/kb-pjt-24-2-api:${API_TAG}

    # 호스트 nginx 만 접근한다. 외부에서 Tomcat 에 직접 도달할 수 없으므로
    # 모든 트래픽이 반드시 HTTPS 를 거친다.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      CATALINA_OPTS: >-
        -Dgighub.database.config=/config/database.properties
        -Dgighub.log.dir=/var/gighub/logs
        -Duser.timezone=Asia/Seoul
      TZ: Asia/Seoul

    volumes:
      # 접속정보와 배포 설정. 이미지에 굽지 않는다.
      - /opt/gighub/config/database.properties:/config/database.properties:ro
      # 계약 PDF 는 LocalFileDocumentStorageAdapter 가 실제 파일로 쓴다.
      # 볼륨이 아니면 재배포마다 발급된 계약서가 사라진다.
      - /opt/gighub/documents:/var/gighub/documents
      # WARN 이상 애플리케이션 로그. 볼륨이 아니면 장애를 조사하려는 시점에는
      # 이미 컨테이너를 교체한 뒤라 정작 필요한 로그가 사라진다.
      - /opt/gighub/logs:/var/gighub/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Tomcat 기동 + Spring 컨텍스트 초기화 시간을 고려한다.
      start_period: 60s

  # 수동 실행 전용. docker compose --profile tools run --rm flyway <command>
  flyway:
    image: flyway/flyway:12.9.0
    profiles: ["tools"]
    environment:
      FLYWAY_URL: ${FLYWAY_URL}
      FLYWAY_USER: ${FLYWAY_USER}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_CONNECT_RETRIES_INTERVAL: "5"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_FAIL_ON_MISSING_LOCATIONS: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - /opt/gighub/migrations:/flyway/sql:ro
      # Flyway CLI 이미지에는 MySQL Connector/J 가 없으므로 backend 의
      # prepareFlywayDriver Task 산출물을 얹는다.
      #
      # 반드시 파일 단위로 마운트한다. /flyway/drivers 를 디렉터리째 마운트하면
      # 이미지에 내장된 다른 DB 플러그인의 드라이버까지 가려져,
      # Flyway 가 플러그인 로딩 단계에서 ServiceConfigurationError 로 죽는다.
      # (예: CassandraDatabase -> NoClassDefFoundError DriverOption)
      # 루트 compose.yaml 도 같은 이유로 파일 단위 마운트를 쓴다.
      - /opt/gighub/drivers/mysql-connector-j-9.7.0.jar:/flyway/drivers/mysql-connector-j-9.7.0.jar:ro

  # 수동 실행 전용. seed SQL 한 개를 RDS 에 적용한다.
  #   docker compose -f ... --profile tools run --rm -e SEED_FILE=<이름>.sql seed
  #
  # flyway 와 나란히 두되 따로 둔다. Migration 은 한 번만 되돌릴 수 없이 적용되고
  # seed 는 반복 실행이 목적이라 성질이 반대다. 한 명령에 묶으면 seed 를 다시
  # 넣으려다 DDL 까지 건드리게 된다.
  seed:
    image: mysql:8.4.10
    profiles: ["tools"]
    environment:
      # 접속값을 flyway 와 공유한다. mysql 전용 변수를 따로 두면 RDS 엔드포인트나
      # 비밀번호가 바뀔 때 한쪽만 고쳐져 조용히 어긋난다. URL 파싱은 apply-seed.sh 가
      # 하고, 그 파싱은 scripts/apply-seed.test.js 가 고정한다.
      FLYWAY_URL: ${FLYWAY_URL}
      FLYWAY_USER: ${FLYWAY_USER}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD}
      SEED_FILE: ${SEED_FILE:-}
    volumes:
      - /opt/gighub/seed:/seed:ro
      - /opt/gighub/apply-seed.sh:/apply-seed.sh:ro
    entrypoint: ["sh", "/apply-seed.sh"]
