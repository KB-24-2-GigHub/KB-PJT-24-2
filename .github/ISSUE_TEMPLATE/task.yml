name: 작업 태스크
description: 설정, 문서, 리팩터링, 테스트와 조사 작업을 등록합니다.
title: "chore: [AREA] "
labels: ["type: task"]
body:
  - type: markdown
    attributes:
      value: |
        제목은 `<type>: [AREA] 작업 요약` 형식으로 작성합니다.
        작업 성격에 따라 `docs`, `style`, `refactor`, `test`, `chore`, `build`, `ci`, `perf`, `revert`를 사용합니다.
  - type: dropdown
    id: work_type
    attributes:
      label: 작업 종류
      options:
        - docs
        - style
        - refactor
        - test
        - chore
        - build
        - ci
        - perf
        - revert
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업이 남길 결과를 한 문단으로 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: PR 병합 전에 확인할 수 있는 3~7개 조건을 적습니다.
      placeholder: |
        - [ ] 결과물이 코드·문서·설정으로 남는다.
        - [ ] 관련 검증이 통과한다.
        - [ ] 잔여 위험이 기록된다.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 비범위
      description: 이번 작업에서 수정하지 않을 인접 영역을 적습니다.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: 위험도
      options:
        - R0 — 문구·비동작 메타데이터
        - R1 — 국소 UI·문서·테스트
        - R2 — 일반 애플리케이션 동작·구조
        - R3 — 보안·금액·Schema·통합 경계
    validations:
      required: true
  - type: input
    id: primary_module
    attributes:
      label: 주 모듈
      placeholder: governance
    validations:
      required: true
  - type: textarea
    id: affected_modules
    attributes:
      label: 영향 모듈
      description: 직접 변경하거나 계약 영향을 받는 모듈만 적습니다.
    validations:
      required: true
  - type: textarea
    id: required_operations
    attributes:
      label: 관련 Operation (API 영향 시만)
      description: 영향받는 Method/Path 또는 Operation ID를 적습니다. API 영향이 없으면 비워 둡니다.
  - type: textarea
    id: migration_scope
    attributes:
      label: Migration 범위 (DB 영향 및 승인 시만)
      description: PM/Admin이 승인한 table, invariant, 신규 Flyway 범위와 검증을 적습니다. 작업 이슈만으로 권한을 추론하지 않습니다.
      placeholder: |
        - 승인 근거:
        - 대상 table/invariant:
        - 신규 Migration:
        - disposable/local DB 검증:
  - type: textarea
    id: verification
    attributes:
      label: 검증
      description: 변경 위험에 맞는 focused test, build, link 또는 수동 검증을 적습니다.
    validations:
      required: true
  - type: textarea
    id: depends_on
    attributes:
      label: 선행 이슈
      description: 직접 blocked-by 이슈를 적고 GitHub native dependency도 연결합니다. 없으면 `N/A`를 적습니다.
      placeholder: "#123 또는 N/A"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 기준 문서 / Parent / 참고
  - type: checkboxes
    id: title_convention
    attributes:
      label: 제목 컨벤션 확인
      options:
        - label: "이슈 제목을 `<type>: [AREA] 작업 요약` 형식으로 작성했습니다."
          required: true
