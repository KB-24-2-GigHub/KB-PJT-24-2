name: Seed DB

# 수동 전용. seed SQL 한 개를 운영 RDS 에 적용한다.
#
# migrate-db.yml 과 나란히 두되 합치지 않는다. Migration 은 한 번만 되돌릴 수 없이
# 적용되고 seed 는 반복 실행이 목적이라 성질이 반대다. 한 버튼에 묶으면 seed 를 다시
# 넣으려다 DDL 까지 나간다.
#
# 이 파일도 기본 브랜치에 있어야 한다. workflow_dispatch 전용이라 스스로 실행될
# 방법이 없고, 기본 브랜치가 유일한 Actions 등록 경로다. 없으면 이렇게 거부된다.
#   HTTP 404: workflow seed-db.yml not found on the default branch
#
# 적용 대상 SQL 은 backend/src/test/resources/db/seed/ 에 있다. 기존 test-*.sql은
# 고정 Fixture이고 demo-*.sql은 모든 애플리케이션 데이터를 지운 뒤 시연 상태를 다시 만든다.
# 그래서 demo 시드는 별도 확인 문구, 앱 정지, 문서 저장소 초기화를 추가로 요구한다.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "기존 Fixture는 seed, 전체 초기화 demo는 reset-all-data 입력"
        required: true
        default: ""
      file:
        description: "적용할 seed 파일명 (예: test-contract-escrow.sql)"
        required: true
        default: ""

concurrency:
  group: seed-db
  cancel-in-progress: false

jobs:
  seed:
    # 버튼을 잘못 눌러 운영 데이터가 바뀌는 것을 막는다.
    if: inputs.confirm == 'seed' || inputs.confirm == 'reset-all-data'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 이 워크플로에는 원래 permissions 블록이 없어 기본값을 그대로 썼다. id-token 을
    # 주려면 블록을 만들어야 하고, 블록을 만드는 순간 기본값이 통째로 대체된다.
    # checkout 이 계속 동작하도록 contents: read 를 함께 명시한다.
    permissions:
      contents: read
      id-token: write

    env:
      AWS_DEFAULT_REGION: ap-northeast-2
      REMOTE: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
      SEED_SOURCE: backend/src/test/resources/db/seed

    steps:
      - uses: actions/checkout@v4

      # inputs.file 을 run 스크립트에 직접 박지 않는다. GitHub 이 셸 파싱 전에
      # 문자열을 치환하므로 작은따옴표나 줄바꿈이 든 값이 셸 구문으로 실행되고,
      # 스크립트 안의 어떤 검사도 그보다 먼저 돌 수 없다. env 로 넘겨 셸이 값을
      # 변수로만 보게 한 뒤, 저장소에 실존하는 파일 이름과의 일치로 검증한다.
      #
      # 존재하지 않는 이름으로 보안그룹 개방까지 간 뒤 실패하는 것도 낭비이므로
      # 여기서 먼저 끊는다. apply-seed.sh 도 자체 가드를 갖지만 그것은 심층 방어다.
      - name: Resolve seed file
        id: seed
        env:
          SEED_FILE_INPUT: ${{ inputs.file }}
          SEED_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          name="$(sh scripts/resolve-seed-file.sh)"
          case "$name" in
            demo-*.sql)
              expected="reset-all-data"
              is_demo="true"
              ;;
            *)
              expected="seed"
              is_demo="false"
              ;;
          esac
          if [ "$SEED_CONFIRM" != "$expected" ]; then
            echo "::error::$name 실행 확인값은 $expected 이어야 한다."
            exit 1
          fi
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
          printf 'is_demo=%s\n' "$is_demo" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem

      # 만료되지 않는 IAM User Key 대신 이 실행에만 유효한 임시 세션을 받는다.
      # 자격증명은 이후 모든 Step 에 남으므로 job 마지막의 Close SSH 도 같은 세션을
      # 쓴다. role-duration-seconds 를 좁게 주면 그 revoke 가 만료로 실패해 22번
      # /32 규칙이 열린 채 남으므로 값을 생략하고 Role 의 MaxSessionDuration 을 따른다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # 22번 인바운드는 평소 닫혀 있다. 이 실행의 러너 IP 만 잠시 허용한다.
      - name: Open SSH for this runner
        id: sg
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -sS --retry 3 https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='gh-seed run ${{ github.run_id }}'}]"
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # compose.prod.yaml 은 Deploy API 가 배포마다 올린다(#452). 이 워크플로는
      # 덮어쓰지 않는다. 대신 seed 서비스가 반영돼 있는지 먼저 보고, 없으면 무엇을
      # 해야 하는지 알려주고 끊는다.
      - name: Check seed service is present on server
        run: |
          set -euo pipefail
          if ! ssh -i ~/.ssh/deploy.pem "${REMOTE}" \
            "docker compose -f /opt/gighub/compose.prod.yaml --profile tools config --services" \
            | grep -qx seed; then
            echo "::error::/opt/gighub/compose.prod.yaml 에 seed 서비스가 없다."
            echo "::error::서버 파일이 저장소보다 낡았다. Deploy API 를 한 번 돌리면 갱신된다."
            echo "::error::기다릴 수 없으면: scp deploy/compose.prod.yaml <user>@<host>:/opt/gighub/compose.prod.yaml"
            exit 1
          fi

      - name: Upload seed SQL fragments and entrypoint
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy.pem "${REMOTE}" "mkdir -p /opt/gighub/seed"
          scp -i ~/.ssh/deploy.pem \
            "${SEED_SOURCE}"/*.sql \
            "${SEED_SOURCE}"/*.inc \
            "${REMOTE}:/opt/gighub/seed/"
          scp -i ~/.ssh/deploy.pem \
            deploy/apply-seed.sh \
            "${REMOTE}:/opt/gighub/apply-seed.sh"

      # demo 시드는 앱이 Scheduler나 사용자 요청으로 초기화 도중 데이터를 다시 쓰지 못하게
      # 먼저 멈춘다. 이후 단계가 실패해도 Restart step은 always()로 실행한다.
      - name: Stop application for full demo reset
        id: stop_app
        if: steps.seed.outputs.is_demo == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy.pem "${REMOTE}" \
            "docker compose -f /opt/gighub/compose.prod.yaml stop app"

      # 원격 명령은 문자열 한 덩어리로 전달되어 서버 셸이 다시 파싱한다. 값은
      # 이미 허용 목록을 통과해 [A-Za-z0-9._-] 만 남지만, 원격에 넘기는 값은
      # 명시적으로 이스케이프한 뒤 끼운다. 허용 목록이 나중에 느슨해져도 이쪽이
      # 무너지지 않게 한다.
      - name: Apply seed
        env:
          SEED_FILE_NAME: ${{ steps.seed.outputs.name }}
          SEED_RESET_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          escaped="$(printf '%q' "$SEED_FILE_NAME")"
          escaped_confirm="$(printf '%q' "$SEED_RESET_CONFIRM")"
          ssh -i ~/.ssh/deploy.pem "${REMOTE}" \
            "docker compose -f /opt/gighub/compose.prod.yaml --profile tools run --rm -e SEED_FILE=${escaped} -e DEMO_RESET_CONFIRM=${escaped_confirm} seed"

      # SQL이 실패하면 Transaction이 Rollback되므로 기존 문서도 그대로 보존합니다.
      # 새 DB 상태가 확정된 뒤에만 더 이상 참조되지 않는 기존 파일을 지웁니다.
      - name: Clear production document storage for full demo reset
        if: steps.seed.outputs.is_demo == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy.pem "${REMOTE}" '
            set -eu
            mkdir -p /opt/gighub/documents
            resolved="$(readlink -f -- /opt/gighub/documents)"
            if [ "$resolved" != "/opt/gighub/documents" ]; then
              echo "unexpected document storage path: $resolved" >&2
              exit 1
            fi
            # 문서는 Tomcat 컨테이너가 자기 UID 로 쓴다. SSH 사용자 권한으로는 지울 수
            # 없어서 2026-08-19 실행(run 32234708454)이 여기서 Permission denied 로 멈췄다.
            # 지우지 못한 대상은 컨테이너가 만든 documents/contracts 디렉터리였다.
            #
            # 그 실패가 이 Step 에서 끝나지 않는 것이 진짜 문제였다. 뒤따르는 앱 기동 확인과
            # Complete functional demo through public API 가 전부 건너뛰어져, SQL 은 적용됐는데
            # 초대 수락·계약서 PDF·보건증이 없는 반쪽 시연 상태로 끝난다.
            #
            # 권한 상승은 위 경로 검증을 통과한 뒤에만 한다. 순서를 바꾸면 sudo 가 검증되지
            # 않은 경로를 지우게 된다.
            sudo find "$resolved" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          '

      # start 를 쓴다. start 는 위 stop 이 남겨 둔 그 컨테이너를 그대로 다시 켜므로
      # 이미지 태그를 아예 해석하지 않는다. up -d 는 태그를 다시 해석하고 그 값은
      # 서버 /opt/gighub/.env 에서 오므로, 이 워크플로가 확인할 수 없는 파일의 상태에
      # 재기동 결과가 달리게 된다. 시드가 하려는 일은 "정지한 것을 되살리기" 이지
      # "지금 옳은 버전을 고르기" 가 아니다.
      #
      # 2026-08-19 에 여기서 up -d 를 써서 구버전 WAR 가 올라왔다(#450,
      # run 32236069569). 경위는 deploy/SETUP.md 7절.
      #
      # 이 Step 은 stop 이 성공했을 때만 실행되므로 되살릴 컨테이너가 있다는 것도
      # 보장된다.
      - name: Restart application after full demo reset
        id: restart_app
        if: always() && steps.seed.outputs.is_demo == 'true' && steps.stop_app.outcome == 'success'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy.pem "${REMOTE}" \
            "docker compose -f /opt/gighub/compose.prod.yaml start app"

      - name: Wait for application after full demo reset
        if: steps.seed.outputs.is_demo == 'true'
        run: |
          set -euo pipefail
          curl -fsS --retry 18 --retry-delay 5 --retry-all-errors \
            "https://api.gighub.store/api/health"
          echo

      # 기능 SEED의 초대 Token, 계약 PDF, 알림, 보건증은 실제 API를 거쳐야 유효하다.
      - name: Complete functional demo through public API
        if: steps.seed.outputs.name == 'demo-functional.sql'
        env:
          DEMO_SEED_CONFIRM: ${{ inputs.confirm }}
          GIGHUB_API_BASE_URL: https://api.gighub.store
        run: |
          set -euo pipefail
          node scripts/prepare-demo-seed.js functional \
            --skip-sql \
            --confirm-production-reset

      # 실패 여부와 무관하게 반드시 회수한다.
      - name: Close SSH
        if: always() && steps.sg.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.sg.outputs.runner_ip }}/32" \
          || echo "::warning::SSH 규칙 회수 실패. 보안그룹을 직접 확인할 것"

      # seed 가 들어간 뒤에도 애플리케이션이 정상인지 본다.
      - name: Verify application after seed
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
            "https://api.gighub.store/api/health"
          echo
