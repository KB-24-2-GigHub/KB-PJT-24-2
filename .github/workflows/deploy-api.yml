name: Deploy API

# 브랜치 이름을 이 파일에 두지 않는다. 배포 대상은 아래 if 와
# GitHub Variable DEPLOY_BRANCH 하나로 결정한다.
#
#   변수 = <브랜치명>   해당 브랜치 push 마다 자동 배포
#   변수 삭제           자동 배포 꺼짐. 수동 버튼만 동작
#
#     gh variable set DEPLOY_BRANCH --body "dev"    # 켜기
#     gh variable delete DEPLOY_BRANCH              # 끄기
#
# GitHub API 는 값이 빈 변수를 거부하므로(422) 끄는 방법은 삭제다. 정의되지 않은
# 변수는 빈 문자열로 평가되고 github.ref_name 은 절대 빈 문자열이 아니므로
# 조건이 거짓이 된다. 팀이 공유하는 브랜치에서는 삭제 상태를 기본으로 삼는다.
on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref_name == vars.DEPLOY_BRANCH
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      # OIDC 토큰 발급 권한. 이것이 없으면 AssumeRole 이 시작조차 못 한다.
      id-token: write

    env:
      IMAGE: ghcr.io/kb-24-2-gighub/kb-pjt-24-2-api
      API_HOST: api.gighub.store
      WEB_ORIGIN: https://gighub.store
      AWS_DEFAULT_REGION: ap-northeast-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # gradle check 는 war 를 의존하지 않는다. 이미지가 옛 WAR 을 담지 않도록
      # 배포마다 반드시 새로 빌드한다.
      - name: Build WAR
        run: sh backend/gradlew -p backend war

      - name: Compute image tag
        id: tag
        # 브랜치 이름의 슬래시는 Docker 태그에 쓸 수 없다.
        run: echo "branch=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # 러너 기본 buildx 드라이버는 docker 이고 캐시 export 를 지원하지 않는다.
      # cache-to: type=gha 를 쓰려면 docker-container 드라이버가 필요하다.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 러너 이미지에 OpenSSH 가 기본 탑재되어 있으므로 서드파티 액션을 쓰지 않는다.
      # 이전에 쓰던 appleboy/ssh-action 은 실행 시점에 drone-ssh 바이너리를 GitHub
      # Releases 에서 내려받는데, 그 다운로드가 HTTP 500 으로 실패해 배포가 멈춘 적이 있다
      # (2026-08-12, run 31608102007). 배포 경로에 실행 시점 외부 의존을 두지 않는다.
      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem

      # 만료되지 않는 IAM User Key 대신 이 실행에만 유효한 임시 세션을 받는다.
      # 액션이 자격증명을 $GITHUB_ENV 로 내보내므로 이후 모든 Step 이 같은 세션을
      # 쓴다. 아래 Open SSH 와 job 마지막의 Close SSH 가 그 대상이다.
      #
      # role-duration-seconds 를 좁게 주지 않는다. 세션이 job 보다 먼저 만료되면
      # Close SSH 의 revoke 가 실패해 22번 /32 규칙이 열린 채 남는다. 값을 생략하면
      # Role 의 MaxSessionDuration 을 따르므로, 그 값이 위 timeout-minutes 를
      # 덮는지 확인한 뒤에만 타임아웃을 늘린다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # 22번 인바운드는 평소 닫혀 있다. 이 실행의 러너 IP 만 잠시 허용한다.
      - name: Open SSH for this runner
        id: sg
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -sS --retry 3 https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          echo "Runner IP: ${RUNNER_IP}"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='gh-actions run ${{ github.run_id }}'}]"
          # 호스트 키 수집은 22번이 열린 뒤여야 한다. 순서를 바꾸면 타임아웃으로 실패한다.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # .env 갱신은 stdin 으로 넘기는 원격 스크립트에 인라인하지 않고 파일로 올린다.
      # 이 로직은 FLYWAY_* 접속값이 함께 든 파일을 제자리에서 고치므로 실행 전에
      # 검증돼야 하고, 파일이어야 scripts/set-api-tag.test.js 가 실제로 돌려볼 수 있다.
      # 서버에 남으므로 롤백 뒤 손으로 맞출 때도 같은 스크립트를 쓴다(SETUP.md 10절).
      - name: Upload .env updater
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy.pem -o ConnectTimeout=15 \
            deploy/set-api-tag.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/gighub/set-api-tag.sh"

      # 원격 스크립트는 stdin 으로 넘긴다. 따옴표 중첩 없이 여러 줄을 그대로 보낼 수 있고,
      # ssh 가 원격 종료 코드를 그대로 반환하므로 set -euo pipefail 의 실패가 이 Step 의
      # 실패가 된다. 이 전파는 실측으로 확인했다(원격 false -> 이후 줄 미실행 -> exit 1).
      - name: Deploy over SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy.pem -o ConnectTimeout=15 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/gighub
          export API_TAG=${{ github.sha }}
          docker compose -f compose.prod.yaml pull app
          docker compose -f compose.prod.yaml up -d app
          # up -d 뒤에 갱신한다. .env 는 "지금 떠 있는 것" 을 가리켜야 하므로, 기동이
          # 실패하면 직전 값이 남는 편이 맞다. 셸의 export 는 이 세션과 함께 사라지고
          # .env 만 서버에 남으므로, 이 한 줄이 없으면 다음 맨손 up -d 가 옛 태그로
          # 되돌아간다 (#450, #452).
          sh set-api-tag.sh "$API_TAG"
          docker image prune -f
          REMOTE

      # 배포 성공 여부와 무관하게 반드시 회수한다.
      - name: Close SSH
        if: always() && steps.sg.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.sg.outputs.runner_ip }}/32" \
          || echo "::warning::SSH 규칙 회수 실패. 보안그룹을 직접 확인할 것"

      # 상태 코드만으로는 배포 성공을 판정하지 않는다.
      # /api/health 는 DB 를 조회하지 않는 순수 liveness 이고 HikariCP 는 지연
      # 초기화라, DB 가 망가져도 200 을 반환한다. 옛 WAR 이 배포돼도 200 이다.
      - name: Smoke test
        run: |
          set -euo pipefail

          echo "--- 1. DB 전 구간 (users 테이블 SELECT) ---"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors \
            "https://${API_HOST}/api/auth/login-id-availability?loginId=ci-smoke-check"
          echo

          echo "--- 2. CSRF 쿠키 속성 ---"
          COOKIE="$(curl -sS -D - -o /dev/null "https://${API_HOST}/api/auth/csrf" \
                    | grep -i '^set-cookie:')"
          echo "${COOKIE}"
          echo "${COOKIE}" | grep -q 'Domain=gighub.store' \
            || { echo "::error::CSRF 쿠키에 Domain 이 없다. security.cookie.domain 누락 또는 옛 WAR 배포"; exit 1; }
          echo "${COOKIE}" | grep -qi '; *Secure' \
            || { echo "::error::CSRF 쿠키에 Secure 가 없다. nginx X-Forwarded-Proto 누락 또는 RemoteIpValve 없는 옛 WAR"; exit 1; }

          echo "--- 3. CORS 허용 Origin ---"
          ACAO="$(curl -sS -D - -o /dev/null -X OPTIONS \
                   -H "Origin: ${WEB_ORIGIN}" \
                   -H "Access-Control-Request-Method: POST" \
                   "https://${API_HOST}/api/auth/login" \
                   | grep -i '^access-control-allow-origin:')"
          echo "${ACAO}"
          echo "${ACAO}" | grep -q "${WEB_ORIGIN}" \
            || { echo "::error::CORS 가 프론트 Origin 을 허용하지 않는다. cors.allowed-origins 확인"; exit 1; }

          echo "배포 검증 통과"

      - name: Report deployed revision
        if: success()
        run: |
          echo "### 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 커밋: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 이미지: \`${IMAGE}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 롤백: EC2 에서 \`API_TAG=<이전sha> docker compose -f /opt/gighub/compose.prod.yaml up -d app\`" >> "$GITHUB_STEP_SUMMARY"
          # 두 줄이다. .env 를 함께 되돌리지 않으면 이후 맨손 up -d 가 방금 물린
          # 버전을 다시 올린다(SETUP.md 10절).
          echo "  그리고 \`sh /opt/gighub/set-api-tag.sh <이전sha>\` — 둘 다 해야 되돌린 상태가 유지된다" >> "$GITHUB_STEP_SUMMARY"
