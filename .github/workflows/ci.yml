name: CI

on:
  pull_request:
  push:
    branches: [dev2, dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # check:guardrails 의 --all 스코프는 origin/<integration base> 와의 merge-base 를
      # 기준으로 삼는다(scripts/check-project-guardrails.js:185-205).
      #
      # pull_request 에서는 GITHUB_BASE_REF 가 올바른 기준을 준다. push 에서는 비어 있어
      # DEFAULT_INTEGRATION_BASE 인 dev 로 떨어지는데, dev2 push 를 dev 기준으로 전체
      # 비교하면 Refactoring 프로그램 24커밋이 통째로 범위에 들어간다. 그 범위의
      # accepted Patch 위반은 #295 RF-14 가 dev2 → dev 통합에서 정리할 몫이며,
      # 이 워크플로가 떠안으면 상시 빨간불이 된다.
      #
      # 두 변수를 동시에 다른 값으로 주면 스크립트가 예외를 던지므로,
      # pull_request 에서는 빈 값으로 두어 GITHUB_BASE_REF 가 그대로 쓰이게 한다.
      GIGHUB_GUARDRAIL_BASE_REF: ${{ github.event_name == 'push' && github.ref_name || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base 계산에 전체 이력이 필요하다. 기본 depth 1 이면
          # refs/remotes/origin/<base> 가 없어 Guardrail 이 예외로 중단된다.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # frontend/package.json engines 가 npm >=11 <12 를 요구한다.
      - name: Pin npm to the declared range
        run: |
          npm i -g npm@11
          node -v
          npm -v

      - uses: gradle/actions/setup-gradle@v4

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Guardrail, harness, FE test, FE production build, FE lint,
      # BE checkstyle, BE JUnit(database Tag 제외)까지 한 번에 실행한다.
      - name: Run repository check
        run: npm run check

      # Gradle Wrapper 는 스크립트 위치가 아니라 현재 작업 디렉터리를
      # Project Directory 로 삼는다. 저장소 루트에는 build.gradle 이 없으므로
      # -p backend 를 생략하면 실패한다.
      - name: Build deployable WAR
        run: sh backend/gradlew -p backend war

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: gig-hub-war
          path: backend/build/libs/gig-hub.war
          retention-days: 7
