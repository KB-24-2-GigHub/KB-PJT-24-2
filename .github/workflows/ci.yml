name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # check:guardrails 의 --all 스코프는 origin/<integration base> 와의 merge-base 를
      # 기준으로 삼는다(scripts/check-project-guardrails.js 의 getAllComparisonBase()).
      #
      # 기준 선택 순서는 GITHUB_BASE_REF -> GIGHUB_GUARDRAIL_BASE_REF ->
      # DEFAULT_INTEGRATION_BASE("dev") 다(같은 파일의 selectedBase 대입부와
      # DEFAULT_INTEGRATION_BASE 상수).
      #
      # pull_request 에서는 GITHUB_BASE_REF 가 올바른 기준을 주므로 빈 값을 준다.
      # push 에서는 GITHUB_BASE_REF 가 비어 있어 기본값 dev 로 떨어지는데, main push 를
      # dev 기준으로 비교하면 두 브랜치의 격차 전체가 검사 범위가 된다. 자기 브랜치를
      # 기준으로 지정하면 merge-base 가 HEAD 라 비교 범위가 비고, 그 커밋의 Guardrail
      # 검증은 이미 PR 에서 끝나 있다.
      #
      # 두 변수를 동시에 다른 값으로 주면 스크립트가 예외를 던진다
      # (에러 메시지 "Guardrail comparison base mismatch").
      GIGHUB_GUARDRAIL_BASE_REF: ${{ github.event_name == 'push' && github.ref_name || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base 계산에 전체 이력이 필요하다. 기본 depth 1 이면
          # refs/remotes/origin/<base> 가 없어 Guardrail 이 예외로 중단된다.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # frontend/package.json engines 가 npm >=11 <12 를 요구한다.
      - name: Pin npm to the declared range
        run: |
          npm i -g npm@11
          node -v
          npm -v

      - uses: gradle/actions/setup-gradle@v4

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Guardrail, harness, FE test, FE production build, FE lint,
      # BE checkstyle, BE JUnit(database Tag 제외)까지 한 번에 실행한다.
      - name: Run repository check
        run: npm run check

      # Gradle Wrapper 는 스크립트 위치가 아니라 현재 작업 디렉터리를
      # Project Directory 로 삼는다. 저장소 루트에는 build.gradle 이 없으므로
      # -p backend 를 생략하면 실패한다.
      - name: Build deployable WAR
        run: sh backend/gradlew -p backend war

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: gig-hub-war
          path: backend/build/libs/gig-hub.war
          retention-days: 7
