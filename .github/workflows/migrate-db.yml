name: Migrate DB

# 수동 전용. 새 Flyway Migration 이 병합됐을 때만 사람이 실행한다.
#
# 배포 워크플로에서 분리한 이유는 되돌릴 수 없기 때문이다. 애플리케이션은 이전
# 이미지 태그로 즉시 롤백되지만 적용된 DDL 은 돌아오지 않는다. 컬럼을 삭제하는
# Migration 을 배포에 묶으면, 앱을 되돌린 순간 이전 코드가 없는 컬럼을 찾다가
# 전부 실패한다.
#
# 이 파일은 기본 브랜치에 있어야 한다. 다른 브랜치로만 옮기면 버튼이 사라진다.
#
# dispatch 가 가능하려면 워크플로가 Actions 에 등록되어 있어야 하고, 등록 경로는
# 두 가지다. 기본 브랜치에 파일이 존재하거나, 다른 트리거로 한 번이라도 실행된
# 적이 있거나다. 이 파일은 workflow_dispatch 전용이라 스스로 실행될 방법이 없으므로
# 기본 브랜치가 유일한 등록 경로다.
#
# 이슈 #368에서 기본 브랜치를 dev 로 운영하기로 승인했으므로, 워크플로와 실제
# Migration 원본을 dev 에서 함께 관리한다. 기본 브랜치를 다시 바꿀 때는 새 기본
# 브랜치에 이 파일과 올바른 Migration Head가 먼저 도달했는지 확인한 다음 저장소
# 설정을 변경한다. 순서를 바꾸면 다음 오류로 수동 실행 경로가 사라진다.
#   HTTP 404: workflow migrate-db.yml not found on the default branch
#
# 실제 실행은 선택한 ref의 워크플로와 저장소 내용을 사용한다. 현재 운영 Migration
# Head는 dev에 있으므로 Release 전환이 완료되기 전에는 실행 ref도 dev를 사용한다.
#
# 반면 deploy-api.yml 은 push 트리거로 이미 실행된 적이 있어 등록되어 있으므로,
# 기본 브랜치에 없어도 --ref 로 dispatch 할 수 있다.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "RDS 스키마를 변경한다. 진행하려면 migrate 라고 입력"
        required: true
        default: ""

concurrency:
  group: migrate-db
  cancel-in-progress: false

jobs:
  migrate:
    # 버튼을 잘못 눌러 되돌릴 수 없는 변경이 나가는 것을 막는다.
    if: inputs.confirm == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 이 워크플로에는 원래 permissions 블록이 없어 기본값을 그대로 썼다. id-token 을
    # 주려면 블록을 만들어야 하고, 블록을 만드는 순간 기본값이 통째로 대체된다.
    # checkout 이 계속 동작하도록 contents: read 를 함께 명시한다.
    permissions:
      contents: read
      id-token: write

    env:
      AWS_DEFAULT_REGION: ap-northeast-2
      REMOTE: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
      COMPOSE: docker compose -f /opt/gighub/compose.prod.yaml --profile tools run --rm flyway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Flyway CLI 이미지에는 MySQL Connector/J 가 없다.
      - name: Prepare MySQL driver
        run: sh backend/gradlew -p backend prepareFlywayDriver

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem

      # 만료되지 않는 IAM User Key 대신 이 실행에만 유효한 임시 세션을 받는다.
      # 자격증명은 이후 모든 Step 에 남으므로 job 마지막의 Close SSH 도 같은 세션을
      # 쓴다. role-duration-seconds 를 좁게 주면 그 revoke 가 만료로 실패해 22번
      # /32 규칙이 열린 채 남으므로 값을 생략하고 Role 의 MaxSessionDuration 을 따른다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # 22번 인바운드는 평소 닫혀 있다. 이 실행의 러너 IP 만 잠시 허용한다.
      - name: Open SSH for this runner
        id: sg
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -sS --retry 3 https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='gh-migrate run ${{ github.run_id }}'}]"
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload migrations and driver
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy.pem \
            backend/src/main/resources/db/migration/*.sql \
            "${REMOTE}:/opt/gighub/migrations/"
          scp -i ~/.ssh/deploy.pem \
            backend/build/flyway-drivers/*.jar \
            "${REMOTE}:/opt/gighub/drivers/"

      # 적용 예정 목록을 먼저 로그에 남긴다. 실패 시 어디서 멈췄는지 판단할 근거다.
      - name: Show pending migrations
        run: ssh -i ~/.ssh/deploy.pem "${REMOTE}" "${COMPOSE} info"

      - name: Apply migrations
        run: ssh -i ~/.ssh/deploy.pem "${REMOTE}" "${COMPOSE} migrate"

      - name: Verify schema head
        run: ssh -i ~/.ssh/deploy.pem "${REMOTE}" "${COMPOSE} info"

      # 실패 여부와 무관하게 반드시 회수한다.
      - name: Close SSH
        if: always() && steps.sg.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.sg.outputs.runner_ip }}/32" \
          || echo "::warning::SSH 규칙 회수 실패. 보안그룹을 직접 확인할 것"

      # Migration 적용 후 애플리케이션이 새 스키마로 정상 동작하는지 본다.
      - name: Verify application against migrated schema
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
            "https://api.gighub.store/api/auth/login-id-availability?loginId=migrate-smoke"
          echo
