services:
  db:
    image: mysql:8.4.10
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  flyway:
    image: flyway/flyway:12.9.0
    profiles: ["tools"]
    environment:
      FLYWAY_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FSeoul
      FLYWAY_USER: ${MYSQL_USER}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_CONNECT_RETRIES_INTERVAL: "5"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_FAIL_ON_MISSING_LOCATIONS: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro
      - ./backend/build/flyway-drivers/mysql-connector-j-9.7.0.jar:/flyway/drivers/mysql-connector-j-9.7.0.jar:ro
    depends_on:
      db:
        condition: service_healthy

  seed-contract-test:
    image: mysql:8.4.10
    profiles: ["tools"]
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PWD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./backend/src/test/resources/db/seed:/seed:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        exec mysql
        --host="$${MYSQL_HOST}"
        --user="$${MYSQL_USER}"
        --default-character-set=utf8mb4
        "$${MYSQL_DATABASE}"
        < /seed/test-contract-escrow.sql
    depends_on:
      db:
        condition: service_healthy

  # 초대 수락 E2E(#267)의 사전 데이터만 넣는다. 근무와 초대는 이 서비스가 아니라
  # 실제 OWNER API 흐름에서 만들어야 Token 원문이 발급 응답에서만 나온다.
  seed-invitation-accept:
    image: mysql:8.4.10
    profiles: ["tools"]
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PWD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./backend/src/test/resources/db/seed:/seed:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        exec mysql
        --host="$${MYSQL_HOST}"
        --user="$${MYSQL_USER}"
        --default-character-set=utf8mb4
        "$${MYSQL_DATABASE}"
        < /seed/test-invitation-accept.sql
    depends_on:
      db:
        condition: service_healthy

  # 통합 시연 SEED는 애플리케이션 데이터를 모두 지우므로 별도 확인값과 고정 허용 목록을
  # 모두 통과해야 실행합니다. SQL 파일명은 Shell 입력으로 자유롭게 확장하지 않습니다.
  seed-demo:
    image: mysql:8.4.10
    profiles: ["tools"]
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PWD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SEED_FILE: ${SEED_FILE:-}
      DEMO_RESET_CONFIRM: ${DEMO_RESET_CONFIRM:-}
    volumes:
      - ./backend/src/test/resources/db/seed:/seed:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        if [ "$${DEMO_RESET_CONFIRM}" != "reset-all-data" ]; then
          echo "DEMO_RESET_CONFIRM=reset-all-data is required" >&2
          exit 1
        fi
        case "$${SEED_FILE}" in
          demo-functional.sql|demo-video-01-onboarding.sql|demo-video-02-check-in.sql|demo-video-03-check-out.sql|demo-video-04-three-years.sql) ;;
          *) echo "unsupported demo seed: $${SEED_FILE}" >&2; exit 1 ;;
        esac
        exec mysql \
          --host="$${MYSQL_HOST}" \
          --user="$${MYSQL_USER}" \
          --default-character-set=utf8mb4 \
          "$${MYSQL_DATABASE}" \
          < "/seed/$${SEED_FILE}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
