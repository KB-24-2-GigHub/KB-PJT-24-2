# Copy this file to database-local.properties and replace only the local values.
database.driver-class-name=com.mysql.cj.jdbc.Driver
database.jdbc-url=jdbc:mysql://localhost:3307/kb_pjt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FSeoul&characterEncoding=UTF-8
database.username=kb_pjt_app
database.password=replace-with-local-app-password

database.pool.maximum-pool-size=10
database.pool.minimum-idle=2
database.pool.connection-timeout-ms=30000
database.pool.validation-timeout-ms=5000

# Invitation link settings. The application loads this same file, so add these keys
# to database-local.properties as well.
# invite.hmac.secret derives invitation tokens and must be at least 32 characters.
# Never commit a real secret; replace the local value below.
invite.hmac.secret=replace-with-local-invitation-hmac-secret
# Set invite.hmac.previous-secret only while rotating the secret, so links issued
# with the old secret stay reproducible until they expire.
invite.hmac.previous-secret=
# Absolute web origin used to build invitation URLs. No path, query or fragment.
invite.web-origin=http://localhost:5173

# Workplace attendance QR settings, loaded from this same file.
# qr.hmac.key.<id> signs the fixed QR and must decode to at least 32 bytes:
#   openssl rand -base64 32
# Never commit a real key; replace the local value below.
qr.hmac.active-key-id=k1
qr.hmac.key.k1=replace-with-local-base64-qr-signing-key
# Rotation differs from invite.hmac.previous-secret on purpose. Invitation tokens
# expire, so trying the previous secret is enough. A fixed QR never expires and is
# printed on a wall, so the token carries its key id and every id still in the field
# must stay registered. List them in qr.hmac.key-ids while rotating:
#   qr.hmac.active-key-id=k2
#   qr.hmac.key-ids=k2,k1
#   qr.hmac.key.k2=<new value>
# Omit qr.hmac.key-ids outside a rotation; the active key alone is registered then.

# Employment contract document storage. A private, non-web-root directory that holds
# generated contract PDFs (DEC-DOCUMENT-STORAGE). Local development uses the repository's
# gitignored /local-data/documents directory; adjust the absolute path for your machine.
document.storage.base-path=/absolute/path/to/local-data/documents

# Deployment-only settings. Leave both unset for local development; the defaults
# reproduce the current local behavior exactly, so database-local.properties needs
# no change. Deployment values live only on the server.
# cors.allowed-origins is a comma-separated list of browser Origins allowed to call
# /api/** with credentials. Unset means http://localhost:5173 only.
#cors.allowed-origins=https://gighub.store
# security.cookie.domain widens the XSRF-TOKEN cookie so a frontend served from a
# different host under the same registrable domain can read it and send the
# X-XSRF-TOKEN header. Unset means the cookie stays host-only.
#security.cookie.domain=gighub.store
# The Secure attribute is not configured here on purpose. Tomcat's RemoteIpValve
# (backend/src/main/webapp/META-INF/context.xml) reads X-Forwarded-Proto, and the
# cookie follows request.isSecure() from there.
